spring.application.name=url-shortener-sb
server.port=${PORT:8080}
server.compression.enabled=true
server.shutdown=graceful

# Neon Postgres - set these as environment variables on Render
# DB_URL example: jdbc:postgresql://ep-super-leaf-axvt6rfg-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urlshortnerdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

# set DDL_AUTO=none on the host once tables exist, it makes cold starts much faster
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jmx.enabled=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET:change-this-secret-in-render-env-at-least-32-chars-long}
jwt.expiration=172800000

# Comma separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ORIGINS:https://jade-pika-41d1bb.netlify.app,http://localhost:5173,http://localhost:3000}

logging.level.org.springframework.security=WARN
